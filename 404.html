uteChangedCallback(){this.hydrate()}}d(y,"observedAttributes",["props"]),customElements.get("astro-island")||customElements.define("astro-island",y)}})();</script><astro-island uid="Z7Ok1i" prefix="r1" component-url="/assets/search.CaVqtv80.js" component-export="Search" renderer-url="/assets/client.BLUn-lwI.js" props="{&quot;entries&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;openai-paperbench.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Working on PaperBench with OpenAI&quot;],&quot;date&quot;:[3,&quot;2025-04-04T00:00:00.000Z&quot;],&quot;type&quot;:[0,&quot;personal highlight&quot;],&quot;description&quot;:[0,&quot;A brief reflection on the development of the PaperBench benchmark in collaboration with OpenAI.&quot;],&quot;tags&quot;:[1,[[0,&quot;paperbench&quot;],[0,&quot;openai&quot;],[0,&quot;AI-for-science&quot;]]],&quot;relatedLinks&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;OpenAI Publication&quot;],&quot;link&quot;:[0,&quot;https://openai.com/index/paperbench/&quot;]}],[0,{&quot;name&quot;:[0,&quot;Algoverse News Publication&quot;],&quot;link&quot;:[0,&quot;https://algoverseairesearch.org/news/openAI&quot;]}]]]}],&quot;body&quot;:[0,&quot;PaperBench is a benchmark that evaluates whether AI agents can replicate state-of-the-art AI research from scratch. Agents are tasked with reproducing papers, which requires understanding each paper’s contributions, building the codebase, and correctly executing the experiments.\r\n\r\nI had the opportunity to contribute to the construction of PaperBench and to work alongside OpenAI during its development.\r\n\r\nThank you to everyone involved for the kind collaboration.\r\n\r\n_Tim_&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/openai-paperbench.md&quot;],&quot;digest&quot;:[0,&quot;df7b34ded265aa49&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;PaperBench is a benchmark that evaluates whether AI agents can replicate state-of-the-art AI research from scratch. Agents are tasked with reproducing papers, which requires understanding each paper’s contributions, building the codebase, and correctly executing the experiments.&lt;/p&gt;\n&lt;p&gt;I had the opportunity to contribute to the construction of PaperBench and to work alongside OpenAI during its development.&lt;/p&gt;\n&lt;p&gt;Thank you to everyone involved for the kind collaboration.&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tim&lt;/em&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Working on PaperBench with OpenAI&quot;],&quot;description&quot;:[0,&quot;A brief reflection on the development of the PaperBench benchmark in collaboration with OpenAI.&quot;],&quot;type&quot;:[0,&quot;personal highlight&quot;],&quot;tags&quot;:[1,[[0,&quot;paperbench&quot;],[0,&quot;openai&quot;],[0,&quot;AI-for-science&quot;]]],&quot;relatedLinks&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;OpenAI Publication&quot;],&quot;link&quot;:[0,&quot;https://openai.com/index/paperbench/&quot;]}],[0,{&quot;name&quot;:[0,&quot;Algoverse News Publication&quot;],&quot;link&quot;:[0,&quot;https://algoverseairesearch.org/news/openAI&quot;]}]]],&quot;date&quot;:[3,&quot;2025-04-04T00:00:00.000Z&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;openai-paperbench&quot;],&quot;render&quot;:[0,null]}],[0,{&quot;id&quot;:[0,&quot;societal-impact-cognitive-offloading.md&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;The Societal Impact of Cognitive Offloading&quot;],&quot;date&quot;:[3,&quot;2025-12-28T00:00:00.000Z&quot;],&quot;type&quot;:[0,&quot;blog&quot;],&quot;description&quot;:[0,&quot;I examine the possibility of a societal shift in human cognition driven by prolonged AI use, that remains an underrepresented risk in current AI safety discourse.&quot;],&quot;tags&quot;:[1,[[0,&quot;psychology&quot;],[0,&quot;societal-shift&quot;],[0,&quot;cognitive-debt&quot;],[0,&quot;sycophancy&quot;],[0,&quot;deprompt&quot;]]],&quot;relatedLinks&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;GitHub Repository&quot;],&quot;link&quot;:[0,&quot;https://github.com/timknappe/deprompt&quot;]}]]]}],&quot;body&quot;:[0,&quot;With the introduction of new technologies, cultural and societal shifts are unforeseeable [@Collingridge1980SocialControl]. This unpredictability has already manifested across many domains in AI safety, noticeable due to incidents regarding AI risk, where initial guardrails were placed loosely and caused harm to society.\r\n\r\nVoices inside the industry, including projects such as [AI 2027](https://ai-2027.com/) and researchers like Geoffrey Hinton and Leopold Aschenbrenner, are already warning about the risk that is emerging from the deployment of AI with tools and within a continuously growing, capable, and only partly (by many defined as insufficiently) monitorable environment [@korbak2025chainthoughtmonitorabilitynew].\r\n\r\nAmong these risks, one that remains comparatively overlooked, due to its threat being mainly in adoption rather than emerging from intelligence as a whole, is AI’s impact on human cognition.\r\n\r\n## Cognitive debt as a societal problem\r\n\r\nIn the pursuit of choosing the path of least resistance, we have degenerated many abilities that were once crucial for our lives. This degradation often occurs silently, as technological advancements normalize skill substitution rather than preservation.\r\n\r\nMechanisms like these, and overreliance on certain technologies, lead us to incur cognitive debt. For the longest time, we didn’t consider or simply didn’t mind the lingering side effects of automation, as it had little to no impact on our daily lives due to the constant availability of its replacements [@ICAO_1992_OperationalImplicationsAutomation].\r\n\r\nAlthough this shift is acceptable in many cases, warning signs are starting to appear that the disruption caused by AI will be a bigger and fundamentally different one, impacting our critical thinking, which is considerably less negligible. With handing off complex work becoming easy and convenient, the danger is that we slowly erode parts of our ability to critically evaluate and understand.\r\n\r\n_Experience with other emerging technologies has shown that, due to “cultural lag,” society is typically faster to incorporate a new technology than to adapt toward its responsible and proper use. There is little doubt that we will witness similar patterns with the adoption of AI._ [@Ogburn1922SocialChange]\r\n\r\n### Mechanisms of Cognitive Debt\r\n\r\nThe processes of neural plasticity are complex; however, the notion of treating the brain like a muscle that can atrophy when given little stimulation seems to be a good intuition for responsible AI use.\r\n\r\nKeeping your mind active and challenging yourself improves crystallized intelligence and cognitive reserve, which have been shown to be helpful in delaying symptoms of early dementia through compensation by other neurons. Logically extrapolating this principle leads to the conclusion that handing off more and more tasks to AI reduces cognitive effort, thereby inducing weaker long-term retention and mental deconditioning in cases of severe overuse.\r\n\r\nAs expected, current research shows that cognitive engagement is lowered when tasks are largely offloaded to LLMs or AI tools [@kosmyna2025brainchatgptaccumulationcognitive]. I consider myself an avid user of AI, so reading into the literature was little surprising given the noticeable effects of regression among fellow software engineers when overusing AI over a prolonged period of time.\r\n\r\n### Avoiding cognitive debt\r\n\r\nThe integration of AI into more and more systems will grow increasingly ubiquitous, making hand-offs easier and easier. With hopes of increased productivity, I still sometimes find myself and many of my peers handing off work to LLMs in an almost fluent and natural fashion. Given that, the growing consensus is obvious, use AI less and engage with tasks on your own. A solution that is simple, but tempting to circumvent given our natural urge for convenience.\r\n\r\nTo counteract this behavior, I will introduce a few changes to my workflow that personally work well for me. When working on coding tasks, I will mostly use AI autocomplete, as it speeds up the coding process while leaving major design decisions and coding practices entirely to me.\r\n\r\nCreative writing and content creation are artful forms of creation that, at least in my opinion, derive their value from human intent. As a result, I aim to keep AI involvement in the creative process to an absolute minimum.\r\n\r\nTo keep my everyday AI usage intentional, I have built [Deprompt](https://github.com/timknappe/deprompt), a small, free, and open-source browser extension that keeps me mindful of my AI usage.\r\n\r\n## AI-Reinforced Brain Patterns\r\n\r\nWith the introduction of social media, a measurable societal shift has emerged that is largely attributed to the cognitive reinforcement of one’s own opinions [@eli2011filter]. Algorithms seem to self-validate users as a side effect of maximizing attention, unintentionally creating bubbles and echo chambers that are now profoundly impacting opinion-building and shaping public discourse. Societally, we are mostly aware of these factors, however, the silent impacts of extremization and polarization continue to persist [@CASTANOPULGARIN2021101608; @Lukin2017Argument].\r\n\r\nSocial media sets a good example of how risks that are apparent can still linger when a majority actively ignores their side effects.\r\n\r\nAI associated risks scale faster than their underlying safety mechanisms, largely due to the novelty of the field and the rapid advancements being made. This is especially the case because the mechanisms inducing these threats are not yet fully understood. While research capacity is growing toward a better comprehension of the cognitive impact of AI usage, we will likely continue to see a disconnect between developers and alignment researchers or, in this context cognitive psychologists.\r\n\r\n### Impact of LLMs on Human Ideology\r\n\r\nAside from the widely discussed risks of grounding facts based on large language models, third-party control, bias, and unknown sources, risk also emerges from the pure modality of human-like interaction itself.\r\n\r\nWith the anthropomorphization of AI comes a natural feeling of being understood and agreed with, which reinforces one’s own opinions as if one were talking to another human. This is perceived as interpersonal affirmation and introduces a significant risk, whereby people may come to value the output and thoughts of an AI on par with those of actual humans.\r\n\r\nAs part of its deployment for human-like interaction, reinforcement learning on human feedback is crucial to tune models toward digestible and value-aligned content. This, however, does not account for unwanted side effects that make such systems more agreeable and therefore more likely to agree on counterintuitive or plainly wrong assumptions and facts. This behavior creates a value gap, both between users who want a factual, truthful, and “honest” model, and the silent risk of self-validation, which can become dangerous.\r\n\r\nAgreeableness and validation are dangerous traits, particularly when paired with a tool that many misjudge as objective. When users feel increasingly validated by a third party, the resulting dynamic bears the risk of justifying radical positions or encouraging impulsive actions.\r\n\r\nA similar risk emerges when AI is used for emotional validation or therapeutic applications. AI judgments are subjective and are quick to [self-diagnose or suggest actions that could be considered medical malpractice](https://www.independent.co.uk/tech/chatgpt-ai-therapy-chatbot-psychosis-mental-health-b2797487.html).\r\n\r\n### Consequences and Actionability\r\n\r\nEinstein said, _“Whoever is careless with the truth in small matters cannot be trusted in important affairs.”_ This quote transfers well to artificial intelligence, whose tendency toward epistemic unreliability undermines trust and therefore requires cautious use.\r\n\r\nFurthermore, relying on AI for neutrality is impossible, so it is important to make this distinction clear, AI systems will always be biased toward the user’s perspective and should not be used solely to validate one’s feelings or thoughts. On the contrary, as these discussions unfold, conversation and dialogue between humans will become more valuable than ever.\r\n\r\n## Stopping it before it gets worse\r\n\r\nReading this, it might appear like my stance toward AI is quite antagonistic. However, the opposite is the case. Given the unique opportunities, I think LLMs and future AI systems can be quite valuable and great tools for many, as long as we keep our outlook on AI specifically aligned with guiding principles such as effective altruism.\r\n\r\nIn controlled environments, Anthropic researchers have discovered signs of deception [@lynch2025agentic; @greenblatt2024alignmentfakinglargelanguage] it’s these threats that pose not only material risks, as bad actors could also influence humans psychologically.\r\n\r\nThis calls for growing, yet still underexplored, risk assessments that quantify cognitive impact. More broadly, we will have to make sure to keep monitoring threats at a societal level that are caused by harmful usage, not only those introduced by emerging intelligence.\r\n\r\n### How to protect oneself\r\n\r\nI am convinced that each individual should follow core principles to balance productivity and life-long learning.\r\n\r\nThe discipline of limiting exposure and going against the natural urge of comfortability will remain an important feat.\r\n\r\nIt requires us to not be ignorant of limitations, AI, in its current state, remains a tool for our use, so it is important to centralize that fact as a cornerstone for our decision-making when using AI in symbiosis with human actors.\r\n\r\nAs a general principle, questioning one’s own rhetoric as well as that produced by LLMs will be more important than ever. With the gratification that comes from agreeable AI, a new risk emerges that we will need to contain and protect ourselves from.\r\n\r\n### Alignment direction\r\n\r\nWe are currently still in the early stages of the capabilities AI will attain. Right now, we hold the control and can steer alignment, which will shape long-term decisions about how we use AI and how the future of AI development will evolve. Given the current pace, AI is weaker than it will ever be again, and we will have to decide how much mental bandwidth we are willing to hand off, how we want to control alignment, and how we will allow AI to shape our society.\r\n\r\n## Appendix\r\n\r\n### Deprompt\r\n\r\nSince the core features of [Deprompt](https://github.com/timknappe/deprompt) are now in place, I will focus on maintenance and incremental improvements, especially as I have other projects to work on. If you have a feature request, idea, or improvement, feel free to open a PR.\r\n\r\n### Related Resources\r\n\r\nAs always, I’ll try to formulate my own thoughts before reading any of the related works, in order to gather my thoughts on the topic freely and unbiased. In my search, I found some great resources that I wanted to share and recommend, as they focus on other subareas of AI risk:\r\n\r\n- [AI 2027](https://ai-2027.com/)\r\n- [Situational Awareness by Leopold Aschenbrenner](https://situational-awareness.ai/)\r\n- [Talk of Geoffrey Hinton on the dangers of AI](https://www.youtube.com/watch?v=giT0ytynSqg)\r\n- [Senate Hearing Regarding AI Risks](https://forum.effectivealtruism.org/posts/67zFQT4GeJdgvdFuk/partial-transcript-of-recent-senate-hearing-discussing-ai-x)\r\n- [Alok Kanojia on Risk of AI for the human psyche](https://www.youtube.com/watch?v=MW6FMgOzklw)\r\n\r\n## References&quot;],&quot;filePath&quot;:[0,&quot;src/content/posts/societal-impact-cognitive-offloading.md&quot;],&quot;digest&quot;:[0,&quot;12327241633bdc13&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;p&gt;With the introduction of new technologies, cultural and societal shifts are unforeseeable &lt;span class=\&quot;\&quot; id=\&quot;citation--collingridge1980socialcontrol--1\&quot;&gt;(Collingridge, 1980)&lt;/span&gt;. This unpredictability has already manifested across many domains in AI safety, noticeable due to incidents regarding AI risk, where initial guardrails were placed loosely and caused harm to society.&lt;/p&gt;\n&lt;p&gt;Voices inside the industry, including projects such as &lt;a href=\&quot;https://ai-2027.com/\&quot;&gt;AI 2027&lt;/a&gt; and researchers like Geoffrey Hinton and Leopold Aschenbrenner, are already warning about the risk that is emerging from the deployment of AI with tools and within a continuously growing, capable, and only partly (by many defined as insufficiently) monitorable environment &lt;span class=\&quot;\&quot; id=\&quot;citation--korbak2025chainthoughtmonitorabilitynew--2\&quot;&gt;(Korbak et al., 2025)&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Among these risks, one that remains comparatively overlooked, due to its threat being mainly in adoption rather than emerging from intelligence as a whole, is AI’s impact on human cognition.&lt;/p&gt;\n&lt;h2 id=\&quot;cognitive-debt-as-a-societal-problem\&quot;&gt;Cognitive debt as a societal problem&lt;/h2&gt;\n&lt;p&gt;In the pursuit of choosing the path of least resistance, we have degenerated many abilities that were once crucial for our lives. This degradation often occurs silently, as technological advancements normalize skill substitution rather than preservation.&lt;/p&gt;\n&lt;p&gt;Mechanisms like these, and overreliance on certain technologies, lead us to incur cognitive debt. For the longest time, we didn’t consider or simply didn’t mind the li rch shows that cognitive engagement is lowered when tasks are largely offloaded to LLMs or AI tools &lt;span class=\&quot;\&quot; id=\&quot;citation--kosmyna2025brainchatgptaccumulationcognitive--5\&quot;&gt;(Kosmyna et al., 2025)&lt;/span&gt;. I consider myself an avid user of AI, so reading into the literature was little surprising given the noticeable effects of regression among fellow software engineers when overusing AI over a prolonged period of time.&lt;/p&gt;\n&lt;h3 id=\&quot;avoiding-cognitive-debt\&quot;&gt;Avoiding cognitive debt&lt;/h3&gt;\n&lt;p&gt;The integration of AI into more and more systems will grow increasingly ubiquitous, making hand-offs easier and easier. With hopes of increased productivity, I still sometimes find myself and many of my peers handing off work to LLMs in an almost fluent and natural fashion. Given that, the growing consensus is obvious, use AI less and engage with tasks on your own. A solution that is simple, but tempting to circumvent given our natural urge for convenience.&lt;/p&gt;\n&lt;p&gt;To counteract this behavior, I will introduce a few changes to my workflow that personally work well for me. When working on coding tasks, I will mostly use AI autocomplete, as it speeds up the coding process while leaving major design decisions and coding practices entirely to me.&lt;/p&gt;\n&lt;p&gt;Creative writing and content creation are artful forms of creation that, at least in my opinion, derive their value from human intent. As a result, I aim to keep AI involvement in the creative process to an absolute minimum.&lt;/p&gt;\n&lt;p&gt;To keep my everyday AI usage intentional, I have built &lt;a href=\&quot;https://github.com/timknappe/deprompt\&quot;&gt;Deprompt&lt;/a&gt;, a small, free, and open-source browser extension that keeps me mindful of my AI usage.&lt;/p&gt;\n&lt;h2 id=\&quot;ai-reinforced-brain-patterns\&quot;&gt;AI-Reinforced Brain Patterns&lt;/h2&gt;\n&lt;p&gt;With the introduction of social media, a measurable societal shift has emerged that is largely attributed to the cognitive reinforcement of one’s own opinions &lt;span class=\&quot;\&quot; id=\&quot;citation--eli2011filter--6\&quot;&gt;(Pariser, 2011)&lt;/span&gt;. Algorithms seem to self-validate users as a side effect of maximizing attention, unintentionally creating bubbles and echo chambers that are now profoundly impacting opinion-building and shaping public discourse. Societally, we are mostly aware of these factors, however, the silent impacts of extremization and polarization continue to persist &lt;span class=\&quot;\&quot; id=\&quot;citation--castanopulgarin2021101608--lukin2017argument--7\&quot;&gt;(Castaño-Pulgarín et al., 2021; Lukin et al., 2017)&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Social media sets a good example of how risks that are apparent can still linger when a majority actively ignores their side effects.&lt;/p&gt;\n&lt;p&gt;AI associated risks scale faster than their underlying safety mechanisms, largely due to the novelty of the field and the rapid advancements being made. This is especially the case because the mechanisms inducing these threats are not yet fully understood. While research capacity is growing toward a better comprehension of the cognitive impact of AI usage, we will likely continue to see a disconnect between developers and alignment researchers or, in this context cognitive psychologists.&lt;/p&gt;\n&lt;h3 id=\&quot;impact-of-llms-on-human-ideology\&quot;&gt;Impact of LLMs on Human Ideology&lt;/h3&gt;\n&lt;p&gt;Aside from the widely discussed risks of grounding facts based on large language models, third-party control, bias, and unknown sources, risk also emerges from the pure modality of human-like interaction itself.&lt;/p&gt;\n&lt;p&gt;With the anthropomorphization of AI comes a natural feeling of being understood and agreed with, which reinforces one’s own opinions as if one were talking to another human. This is perceived as interpersonal affirmation and introduces a significant risk, whereby people may come to value the output and thoughts of an AI on par with those of actual humans.&lt;/p&gt;\n&lt;p&gt;As part of its deployment for human-like interaction, reinforcement learning on human feedback is crucial to tune models toward digestible and value-aligned content. This, however, does not account for unwanted side effects that make such systems more agreeable and therefore more likely to agree on counterintuitive or plainly wrong assumptions and facts. This behavior creates a value gap, both between users who want a factual, truthful, and “honest” model, and the silent risk of self-validation, which can become dangerous.&lt;/p&gt;\n&lt;p&gt;Agreeableness and validation are dangerous traits, particularly when paired with a tool that many misjudge as objective. When users feel increasingly validated by a third party, the resulting dynamic bears the risk of justifying radical positions or encouraging impulsive actions.&lt;/p&gt;\n&lt;p&gt;A similar risk emerges when AI is used for emotional validation or therapeutic applications. AI judgments are subjective and are quick to &lt;a href=\&quot;https://www.independent.co.uk/tech/chatgpt-ai-therapy-chatbot-psychosis-mental-health-b2797487.html\&quot;&gt;self-diagnose or suggest actions that could be considered medical malpractice&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\&quot;consequences-and-actionability\&quot;&gt;Consequences and Actionability&lt;/h3&gt;\n&lt;p&gt;Einstein said, &lt;em&gt;“Whoever is careless with the truth in small matters cannot be trusted in important affairs.”&lt;/em&gt; This quote transfers well to artificial intelligence, whose tendency toward epistemic unreliability undermines trust and therefore requires cautious use.&lt;/p&gt;\n&lt;p&gt;Furthermore, relying on AI for neutrality is impossible, so it is important to make this distinction clear, AI systems will always be biased toward the user’s perspective and should not be used solely to validate one’s feelings or thoughts. On the contrary, as these discussions unfold, conversation and dialogue between humans will become more valuable than ever.&lt;/p&gt;\n&lt;h2 id=\&quot;stopping-it-before-it-gets-worse\&quot;&gt;Stopping it before it gets worse&lt;/h2&gt;\n&lt;p&gt;Reading this, it might appear like my stance toward AI is quite antagonistic. However, the opposite is the case. Given the unique opportunities, I think LLMs and future AI systems can be quite valuable and great tools for many, as long as we keep our outlook on AI specifically aligned with guiding principles such as effective altruism.&lt;/p&gt;\n&lt;p&gt;In controlled environments, Anthropic researchers have discovered signs of deception &lt;span class=\&quot;\&quot; id=\&quot;citation--lynch2025agentic--greenblatt2024alignmentfakinglargelanguage--8\&quot;&gt;(Greenblatt et al., 2024; Lynch et al., 2025)&lt;/span&gt; it’s these threats that pose not only material risks, as bad actors could also influence humans psychologically.&lt;/p&gt;\n&lt;p&gt;This calls for growing, yet still underexplored, risk assessments that quantify cognitive impact. More broadly, we will have to make sure to keep monitoring threats at a societal level that are caused by harmful usage, not only those introduced by emerging intelligence.&lt;/p&gt;\n&lt;h3 id=\&quot;how-to-protect-oneself\&quot;&gt;How to protect oneself&lt;/h3&gt;\n&lt;p&gt;I am convinced that each individual should follow core principles to balance productivity and life-long learning.&lt;/p&gt;\n&lt;p&gt;The discipline of limiting exposure and going against the natural urge of comfortability will remain an important feat.&lt;/p&gt;\n&lt;p&gt;It requires us to not be ignorant of limitations, AI, in its current state, remains a tool for our use, so it is important to centralize that fact as a cornerstone for our decision-making when using AI in symbiosis with human actors.&lt;/p&gt;\n&lt;p&gt;As a general principle, questioning one’s own rhetoric as well as that produced by LLMs will be more important than ever. With the gratification that comes from agreeable AI, a new risk emerges that we will need to contain and protect ourselves from.&lt;/p&gt;\n&lt;h3 id=\&quot;alignment-direction\&quot;&gt;Alignment direction&lt;/h3&gt;\n&lt;p&gt;We are currently still in the early stages of the capabilities AI will attain. Right now, we hold the control and can steer alignment, which will shape long-term decisions about how we use AI and how the future of AI development will evolve. Given the current pace, AI is weaker than it will ever be again, and we will have to decide how much mental bandwidth we are willing to hand off, how we want to control alignment, and how we will allow AI to shape our society.&lt;/p&gt;\n&lt;h2 id=\&quot;appendix\&quot;&gt;Appendix&lt;/h2&gt;\n&lt;h3 id=\&quot;deprompt\&quot;&gt;Deprompt&lt;/h3&gt;\n&lt;p&gt;Since the core features of &lt;a href=\&quot;https://github.com/timknappe/deprompt\&quot;&gt;Deprompt&lt;/a&gt; are now in place, I will focus on maintenance and incremental improvements, especially as I have other projects to work on. If you have a feature request, idea, or improvement, feel free to open a PR.&lt;/p&gt;\n&lt;h3 id=\&quot;related-resources\&quot;&gt;Related Resources&lt;/h3&gt;\n&lt;p&gt;As always, I’ll try to formulate my own thoughts before reading any of the related works, in order to gather my thoughts on the topic freely and unbiased. In my search, I found some great resources that I wanted to share and recommend, as they focus on other subareas of AI risk:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;https://ai-2027.com/\&quot;&gt;AI 2027&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://situational-awareness.ai/\&quot;&gt;Situational Awareness by Leopold Aschenbrenner&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.youtube.com/watch?v=giT0ytynSqg\&quot;&gt;Talk of Geoffrey Hinton on the dangers of AI&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://forum.effectivealtruism.org/posts/67zFQT4GeJdgvdFuk/partial-transcript-of-recent-senate-hearing-discussing-ai-x\&quot;&gt;Senate Hearing Regarding AI Risks&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;https://www.youtube.com/watch?v=MW6FMgOzklw\&quot;&gt;Alok Kanojia on Risk of AI for the human psyche&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;references\&quot;&gt;References&lt;/h2&gt;&lt;div id=\&quot;refs\&quot; class=\&quot;references csl-bib-body\&quot;&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-castanopulgarin2021101608\&quot;&gt;Castaño-Pulgarín, S. A., Suárez-Betancur, N., Vega, L. M. T., &amp;#x26; López, H. M. H. (2021). Internet, social media and online hate speech. Systematic review. &lt;i&gt;Aggression and Violent Behavior&lt;/i&gt;, &lt;i&gt;58&lt;/i&gt;, 101608. https://doi.org/https://doi.org/10.1016/j.avb.2021.101608&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-collingridge1980socialcontrol\&quot;&gt;Collingridge, D. (1980). &lt;i&gt;The Social Control of Technology&lt;/i&gt;. Frances Pinter.&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-greenblatt2024alignmentfakinglargelanguage\&quot;&gt;Greenblatt, R., Denison, C., Wright, B., Roger, F., MacDiarmid, M., Marks, S., Treutlein, J., Belonax, T., Chen, J., Duvenaud, D., Khan, A., Michael, J., Mindermann, S., Perez, E., Petrini, L., Uesato, J., Kaplan, J., Shlegeris, B., Bowman, S. R., &amp;#x26; Hubinger, E. (2024). &lt;i&gt;Alignment faking in large language models&lt;/i&gt;. https://arxiv.org/abs/2412.14093&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-icao_1992_operationalimplicationsautomation\&quot;&gt;International Civil Aviation Organization. (1992). &lt;i&gt;Operational Implications of Automation in Advanced Technology Flight Decks&lt;/i&gt; [ICAO Circular 234-AN/142, Human Factors Digest No.\\ 5]. International Civil Aviation Organization.&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-korbak2025chainthoughtmonitorabilitynew\&quot;&gt;Korbak, T., Balesni, M., Barnes, E., Bengio, Y., Benton, J., Bloom, J., Chen, M., Cooney, A., Dafoe, A., Dragan, A., Emmons, S., Evans, O., Farhi, D., Greenblatt, R., Hendrycks, D., Hobbhahn, M., Hubinger, E., Irving, G., Jenner, E., … Mikulik, V. (2025). &lt;i&gt;Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety&lt;/i&gt;. https://arxiv.org/abs/2507.11473&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-kosmyna2025brainchatgptaccumulationcognitive\&quot;&gt;Kosmyna, N., Hauptmann, E., Yuan, Y. T., Situ, J., Liao, X.-H., Beresnitzky, A. V., Braunstein, I., &amp;#x26; Maes, P. (2025). &lt;i&gt;Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task&lt;/i&gt;. https://arxiv.org/abs/2506.08872&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-lukin2017argument\&quot;&gt;Lukin, S., Anand, P., Walker, M., &amp;#x26; Whittaker, S. (2017). Argument Strength is in the Eye of the Beholder: Audience Effects in Persuasion. &lt;i&gt;ArXiv&lt;/i&gt;, &lt;i&gt;abs/1708.09085&lt;/i&gt;. https://doi.org/10.18653/v1/e17-1070&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-lynch2025agentic\&quot;&gt;Lynch, A., Wright, B., Larson, C., Troy, K. K., Ritchie, S. J., Mindermann, S., Perez, E., &amp;#x26; Hubinger, E. (2025). Agentic Misalignment: How LLMs Could be an Insider Threat. &lt;i&gt;Anthropic Research&lt;/i&gt;.&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-ogburn1922socialchange\&quot;&gt;Ogburn, W. F. (1922). &lt;i&gt;Social Change with Respect to Culture and Original Nature&lt;/i&gt;. B. W. Huebsch.&lt;/div&gt;\n  &lt;div class=\&quot;csl-entry\&quot; id=\&quot;bib-eli2011filter\&quot;&gt;Pariser, Eli. (2011). &lt;i&gt;The filter bubble : what the Internet is hiding from you&lt;/i&gt;. Penguin Press.&lt;/div&gt;\n&lt;/div&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;cognitive-debt-as-a-societal-problem&quot;],&quot;text&quot;:[0,&quot;Cognitive debt as a societal problem&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;mechanisms-of-cognitive-debt&quot;],&quot;text&quot;:[0,&quot;Mechanisms of Cognitive Debt&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;avoiding-cognitive-debt&quot;],&quot;text&quot;:[0,&quot;Avoiding cognitive debt&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;ai-reinforced-brain-patterns&quot;],&quot;text&quot;:[0,&quot;AI-Reinforced Brain Patterns&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;impact-of-llms-on-human-ideology&quot;],&quot;text&quot;:[0,&quot;Impact of LLMs on Human Ideology&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;consequences-and-actionability&quot;],&quot;text&quot;:[0,&quot;Consequences and Actionability&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;stopping-it-before-it-gets-worse&quot;],&quot;text&quot;:[0,&quot;Stopping it before it gets worse&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;how-to-protect-oneself&quot;],&quot;text&quot;:[0,&quot;How to protect oneself&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;alignment-direction&quot;],&quot;text&quot;:[0,&quot;Alignment direction&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;appendix&quot;],&quot;text&quot;:[0,&quot;Appendix&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;deprompt&quot;],&quot;text&quot;:[0,&quot;Deprompt&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;related-resources&quot;],&quot;text&quot;:[0,&quot;Related Resources&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;references&quot;],&quot;text&quot;:[0,&quot;References&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;The Societal Impact of Cognitive Offloading&quot;],&quot;description&quot;:[0,&quot;I examine the possibility of a societal shift in human cognition driven by prolonged AI use, that remains an underrepresented risk in current AI safety discourse.&quot;],&quot;date&quot;:[3,&quot;2025-12-28T00:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;psychology&quot;],[0,&quot;societal-shift&quot;],[0,&quot;cognitive-debt&quot;],[0,&quot;sycophancy&quot;],[0,&quot;deprompt&quot;]]],&quot;relatedLinks&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;GitHub Repository&quot;],&quot;link&quot;:[0,&quot;https://github.com/timknappe/deprompt&quot;]}]]],&quot;type&quot;:[0,&quot;blog&quot;]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;posts&quot;],&quot;slug&quot;:[0,&quot;societal-impact-cognitive-offloading&quot;],&quot;render&quot;:[0,null]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;Search&quot;,&quot;value&quot;:true}" await-children><button class="linkElem" type="button">Search</button><!--astro:end--></astro-island> <a class="linkElem" href="/archive">
